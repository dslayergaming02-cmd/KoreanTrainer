<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Korean Trainer Total v5.5</title>
    <script src="https://unpkg.com/hangul-js@0.2.6/hangul.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; touch-action: manipulation; }
        .container { background: white; padding: 20px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 92%; max-width: 400px; }
        #display { font-size: 50px; font-weight: 800; color: var(--primary); margin: 15px 0; min-height: 80px; }
        #hint { font-size: 1rem; color: #b2bec3; margin-bottom: 15px; min-height: 1.2rem; }
        select, input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 12px; border: 2px solid #eee; font-size: 1rem; box-sizing: border-box; }
        input { font-size: 24px; text-align: center; outline: none; background: #fafafa; border: 3px solid #eee; transition: all 0.2s; -webkit-appearance: none; }
        input.correct { border-color: var(--success) !important; background: #e6fffb !important; pointer-events: none; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        .label { text-align: left; font-size: 0.7rem; font-weight: bold; color: #a2a2a2; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">🇰🇷 Korean Trainer Total</div>
    
    <div class="label">Modalità Visualizzazione</div>
    <select id="mode">
        <option value="h2h">Vedi Hangul ➔ Scrivi Hangul</option>
        <option value="r2h">Vedi Latino ➔ Scrivi Hangul</option>
    </select>

    <div class="label">Tipo di Esercizio</div>
    <select id="level">
        <option value="simple">Sillabe Semplici (C + V)</option>
        <option value="batchim">Sillabe con Batchim (C + V + C)</option>
        <option value="full">Mix Sillabe (Tutte le combinazioni)</option>
        <option value="words">Parole Intere (Vocabolario)</option>
    </select>
    
    <div id="display">--</div>
    <div id="hint">--</div>
    
    <input type="text" id="input" placeholder="Digita..." autocomplete="off" autocapitalize="none" spellcheck="false">
    
    <div class="stats">
        <span>Punti: <span id="score">0</span></span>
        <span>Streak: <span id="streak">0</span> 🔥</span>
    </div>
</div>

<script>
    const input = document.getElementById('input');
    const display = document.getElementById('display');
    const hint = document.getElementById('hint');
    let targetH = "", score = 0, streak = 0, isLock = false;

    // Componenti Alfabeto Completo
    const allCons = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","ㄲ","ㄸ","ㅃ","ㅆ","ㅉ"];
    const allVows = ["ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ","ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ","ㅐ","ㅒ","ㅔ","ㅖ"];
    const allBatchims = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","ㄲ","ㅆ"];

    const vocab = [
        {h:"사과",r:"sagwa"},{h:"나무",r:"namu"},{h:"우유",r:"uyu"},{h:"사람",r:"saram"},
        {h:"고양이",r:"goyangi"},{h:"나라",r:"nara"},{h:"하늘",r:"haneul"},{h:"바다",r:"bada"},
        {h:"학교",r:"hakgyo"},{h:"빵",r:"ppang"},{h:"친구",r:"chingu"},{h:"한국",r:"hanguk"},
        {h:"의자",r:"uija"},{h:"전화",r:"jeonhwa"},{h:"시간",r:"sigan"},{h:"어머니",r:"eomeoni"},
        {h:"아버지",r:"abeoji"},{h:"동생",r:"dongsaeng"},{h:"우산",r:"usan"},{h:"공항",r:"gonghang"}
    ];

    const romMap = {"ㄱ":"g","ㄴ":"n","ㄷ":"d","ㄹ":"r","ㅁ":"m","ㅂ":"b","ㅅ":"s","ㅇ":"","ㅈ":"j","ㅊ":"ch","ㅋ":"k","ㅌ":"t","ㅍ":"p","ㅎ":"h","ㄲ":"kk","ㄸ":"tt","ㅃ":"pp","ㅆ":"ss","ㅉ":"jj","ㅏ":"a","ㅑ":"ya","ㅓ":"eo","ㅕ":"yeo","ㅗ":"o","ㅛ":"yo","ㅜ":"u","ㅠ":"yu","ㅡ":"eu","ㅣ":"i","ㅘ":"wa","ㅙ":"wae","ㅚ":"oe","ㅝ":"wo","ㅞ":"we","ㅟ":"wi","ㅢ":"ui","ㅐ":"ae","ㅒ":"yae","ㅔ":"e","ㅖ":"ye"};

    function getRoman(h) { return Hangul.disassemble(h).map(p => romMap[p] || p).join(""); }

    function genera() {
        isLock = false;
        const lv = document.getElementById('level').value;
        const mode = document.getElementById('mode').value;
        
        let c = allCons[Math.floor(Math.random()*allCons.length)];
        let v = allVows[Math.floor(Math.random()*allVows.length)];
        let b = allBatchims[Math.floor(Math.random()*allBatchims.length)];

        if (lv === "simple") {
            targetH = Hangul.assemble([c, v]);
        } else if (lv === "batchim") {
            targetH = Hangul.assemble([c, v, b]);
        } else if (lv === "full") {
            // 50% probabilità che esca una sillaba con o senza batchim
            targetH = Math.random() > 0.5 ? Hangul.assemble([c, v, b]) : Hangul.assemble([c, v]);
        } else {
            targetH = vocab[Math.floor(Math.random()*vocab.length)].h;
        }

        const targetR = getRoman(targetH);
        display.innerText = (mode === "r2h") ? targetR : targetH;
        hint.innerText = (mode === "r2h") ? "Scrivi in Hangul" : targetR;
        input.value = "";
        input.classList.remove('correct');
        setTimeout(() => input.focus(), 150);
    }

    const check = () => {
        if (isLock) return;
        let val = input.value.trim();
        let isCorrect = (val === targetH) || (Hangul.disassemble(val).join("") === Hangul.disassemble(targetH).join(""));

        if (isCorrect && val !== "") {
            isLock = true;
            score += 10; streak++;
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
            input.classList.add('correct');
            
            try {
                const m = new SpeechSynthesisUtterance(targetH);
                m.lang = 'ko-KR';
                window.speechSynthesis.speak(m);
            } catch(e) {}
            setTimeout(genera, 300);
        }
    };

    input.addEventListener('input', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });
    document.getElementById('level').onchange = genera;
    document.getElementById('mode').onchange = genera;
    genera();
</script>
</body>
</html>
