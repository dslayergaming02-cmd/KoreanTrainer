<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Trainer Ultra v5</title>
    <script src="https://unpkg.com/hangul-js@0.2.6/hangul.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 450px; }
        #display { font-size: 60px; font-weight: 800; color: var(--primary); margin: 20px 0; min-height: 90px; display: flex; align-items: center; justify-content: center; }
        #hint { font-size: 1.2rem; color: #b2bec3; margin-bottom: 15px; min-height: 1.5rem; font-weight: 500; }
        select, input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 2px solid #eee; font-size: 1rem; box-sizing: border-box; }
        input { font-size: 28px; text-align: center; outline: none; background: #fafafa; border: 3px solid #eee; }
        input:focus { border-color: var(--primary); }
        input.correct { border-color: var(--success) !important; background: #e6fffb; transition: 0.1s; }
        .stats { display: flex; justify-content: space-around; margin-top: 20px; font-weight: bold; }
        .label { text-align: left; font-size: 0.7rem; font-weight: bold; color: #a2a2a2; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;">🇰🇷 Korean Trainer v5.0</div>

    <div class="label">Modalità</div>
    <select id="mode">
        <option value="h2h">Vedi Hangul ➔ Scrivi Hangul</option>
        <option value="r2h">Vedi Latino ➔ Scrivi Hangul</option>
    </select>

    <div class="label">Difficoltà</div>
    <select id="level">
        <option value="1">Livello 1: Sillabe Semplici</option>
        <option value="2">Livello 2: Sillabe con Batchim</option>
        <option value="3">Livello 3: Dittonghi e Doppie</option>
        <option value="4">Livello 4: Vocabolario A1-C2</option>
        <option value="5">Livello 5: FULL MIX (Tutto)</option>
    </select>

    <div id="display">--</div>
    <div id="hint">--</div>
    
    <input type="text" id="input" placeholder="Digita..." autocomplete="off">
    
    <div class="stats">
        <span>Score: <span id="score">0</span></span>
        <span>Streak: <span id="streak">0</span> 🔥</span>
    </div>
</div>

<script>
    const input = document.getElementById('input');
    const display = document.getElementById('display');
    const hint = document.getElementById('hint');
    
    let targetH = ""; 
    let targetR = "";
    let score = 0;
    let streak = 0;

    // Database Jamo per romanizzazione dinamica
    const romMap = {
        "ㄱ":"g", "ㄴ":"n", "ㄷ":"d", "ㄹ":"r", "ㅁ":"m", "ㅂ":"b", "ㅅ":"s", "ㅇ":"", "ㅈ":"j", "ㅊ":"ch", "ㅋ":"k", "ㅌ":"t", "ㅍ":"p", "ㅎ":"h",
        "ㄲ":"kk", "ㄸ":"tt", "ㅃ":"pp", "ㅆ":"ss", "ㅉ":"jj",
        "ㅏ":"a", "ㅑ":"ya", "ㅓ":"eo", "ㅕ":"yeo", "ㅗ":"o", "ㅛ":"yo", "ㅜ":"u", "ㅠ":"yu", "ㅡ":"eu", "ㅣ":"i",
        "ㅘ":"wa", "ㅙ":"wae", "ㅚ":"oe", "ㅝ":"wo", "ㅞ":"we", "ㅟ":"wi", "ㅢ":"ui"
    };

    const vocab = [
        {h:"사과", r:"sagwa"}, {h:"나무", r:"namu"}, {h:"집", r:"jip"}, {h:"학생", r:"haksaeng"},
        {h:"경제", r:"gyeongje"}, {h:"물", r:"mul"}, {h:"사람", r:"saram"}, {h:"우유", r:"uyu"},
        {h:"민주주의", r:"minjuju-ui"}, {h:"정체성", r:"jeongcheseong"}, {h:"모순", r:"mosun"}
    ];

    function getRomanization(h) {
        let parts = Hangul.disassemble(h);
        return parts.map(p => romMap[p] || p).join("");
    }

    function genera() {
        let lv = document.getElementById('level').value;
        const mode = document.getElementById('mode').value;
        if (lv == "5") lv = Math.floor(Math.random() * 4) + 1;

        let h = "";
        if (lv == "1") {
            h = Hangul.assemble([["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ"][Math.floor(Math.random()*9)], ["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ"][Math.floor(Math.random()*6)]]);
        } else if (lv == "2") {
            h = Hangul.assemble([["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ"][Math.floor(Math.random()*5)], "ㅏ", ["ㄱ","ㄴ","ㄹ","ㅁ","ㅇ"][Math.floor(Math.random()*5)]]);
        } else if (lv == "3") {
            h = Hangul.assemble([["ㄲ","ㄸ","ㅃ","ㅆ","ㅉ"][Math.floor(Math.random()*5)], ["ㅘ","ㅚ","ㅝ","ㅢ"][Math.floor(Math.random()*4)]]);
        } else {
            let item = vocab[Math.floor(Math.random()*vocab.length)];
            h = item.h;
        }

        targetH = h;
        targetR = getRomanization(h);

        if (mode === "r2h") {
            display.innerText = targetR; // Vedi Latino (es: "bang")
            hint.innerText = "Scrivi in Hangul";
        } else {
            display.innerText = targetH; // Vedi Hangul
            hint.innerText = targetR;
        }
        
        input.value = "";
        input.classList.remove('correct');
        input.focus();
    }

    input.addEventListener('input', () => {
        if (input.value === targetH) {
            score += 10; streak++;
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
            input.classList.add('correct');
            
            // Audio
            const m = new SpeechSynthesisUtterance(targetH);
            m.lang = 'ko-KR';
            window.speechSynthesis.speak(m);

            // Passa alla prossima parola dopo 300ms
            setTimeout(genera, 300);
        }
    });

    document.getElementById('level').onchange = genera;
    document.getElementById('mode').onchange = genera;
    genera();
</script>
</body>
</html>
