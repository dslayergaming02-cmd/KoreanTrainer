<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Korean Trainer Ultra v5.7</title>
    <script src="https://unpkg.com/hangul-js@0.2.6/hangul.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; touch-action: manipulation; }
        .container { background: white; padding: 20px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 92%; max-width: 400px; }
        #display { font-size: 50px; font-weight: 800; color: var(--primary); margin: 10px 0; min-height: 70px; }
        #hint { font-size: 0.9rem; color: #b2bec3; margin-bottom: 5px; }
        #translation { font-size: 1.3rem; color: var(--success); font-weight: bold; margin-bottom: 15px; min-height: 1.6rem; opacity: 0; }
        select, input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 12px; border: 2px solid #eee; font-size: 1rem; box-sizing: border-box; }
        input { font-size: 24px; text-align: center; outline: none; background: #fafafa; border: 3px solid #eee; }
        input.correct { border-color: var(--success) !important; background: #e6fffb !important; pointer-events: none; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; font-weight: bold; font-size: 0.85rem; }
        .category-tag { font-size: 0.7rem; color: white; background: #a2a2a2; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 1rem; font-weight: bold;">🇰🇷 Ultra Trainer v5.7</div>
    <div id="catDisplay" class="category-tag">Generale</div>
    
    <select id="level">
        <option value="words">Vocabolario (Parole Intere)</option>
        <option value="full">Mix Sillabe (Tutte)</option>
    </select>
    
    <div id="display">--</div>
    <div id="hint">--</div>
    <div id="translation">--</div>
    
    <input type="text" id="input" placeholder="Scrivi in Hangul..." autocomplete="off">
    
    <div class="stats">
        <span>Punti: <span id="score">0</span></span>
        <span>Streak: <span id="streak">0</span> 🔥</span>
    </div>
</div>

<script>
    const input = document.getElementById('input');
    const display = document.getElementById('display');
    const hint = document.getElementById('hint');
    const transDiv = document.getElementById('translation');
    const catDisplay = document.getElementById('catDisplay');
    let targetH = "", currentTrans = "", score = 0, streak = 0, isLock = false;

    // DATABASE ESTESO (Ultra Library)
    const vocab = [
        // CIBO & BEVANDE
        {h:"사과", r:"sagwa", t:"Mela", c:"Cibo"}, {h:"물", r:"mul", t:"Acqua", c:"Cibo"}, {h:"우유", r:"uyu", t:"Latte", c:"Cibo"},
        {h:"빵", r:"ppang", t:"Pane", c:"Cibo"}, {h:"밥", r:"bap", t:"Riso/Pasto", c:"Cibo"}, {h:"고기", r:"gogi", t:"Carne", c:"Cibo"},
        {h:"커피", r:"keopi", t:"Caffè", c:"Cibo"}, {h:"차", r:"cha", t:"Tè", c:"Cibo"}, {h:"맥주", r:"maekju", t:"Birra", c:"Cibo"},
        // PERSONE & FAMIGLIA
        {h:"사람", r:"saram", t:"Persona", c:"Persone"}, {h:"친구", r:"chingu", t:"Amico", c:"Persone"}, {h:"어머니", r:"eomeoni", t:"Madre", c:"Persone"},
        {h:"아버지", r:"abeoji", t:"Padre", c:"Persone"}, {h:"동생", r:"dongsaeng", t:"Fratello/Sorella minore", c:"Persone"}, {h:"선생님", r:"seon-saeng-nim", t:"Maestro", c:"Persone"},
        {h:"학생", r:"hak-saeng", t:"Studente", c:"Persone"}, {h:"여자", r:"yeoja", t:"Donna", c:"Persone"}, {h:"남자", r:"namja", t:"Uomo", c:"Persone"},
        // NATURA & TEMPO
        {h:"나무", r:"namu", t:"Albero", c:"Natura"}, {h:"바다", r:"bada", t:"Mare", c:"Natura"}, {h:"하늘", r:"haneul", t:"Cielo", c:"Natura"},
        {h:"산", r:"san", t:"Montagna", c:"Natura"}, {h:"꽃", r:"kkot", t:"Fiore", c:"Natura"}, {h:"해", r:"hae", t:"Sole", c:"Natura"},
        {h:"달", r:"dal", t:"Luna", c:"Natura"}, {h:"비", r:"bi", t:"Pioggia", c:"Natura"}, {h:"눈", r:"nun", t:"Neve/Occhio", c:"Natura"},
        // LUOGHI & OGGETTI
        {h:"집", r:"jip", t:"Casa", c:"Luoghi"}, {h:"학교", r:"hakgyo", t:"Scuola", c:"Luoghi"}, {h:"병원", r:"byeongwon", t:"Ospedale", c:"Luoghi"},
        {h:"공항", r:"gonghang", t:"Aeroporto", c:"Luoghi"}, {h:"책", r:"chaek", t:"Libro", c:"Oggetti"}, {h:"의자", r:"uija", t:"Sedia", c:"Oggetti"},
        {h:"탁자", r:"takja", t:"Tavolo", c:"Oggetti"}, {h:"가방", r:"gabang", t:"Borsa", c:"Oggetti"}, {h:"옷", r:"ot", t:"Vestito", c:"Oggetti"},
        // VERBI & EMOZIONI (Essenziali)
        {h:"가다", r:"gada", t:"Andare", c:"Verbi"}, {h:"오다", r:"oda", t:"Venire", c:"Verbi"}, {h:"먹다", r:"meokda", t:"Mangiare", c:"Verbi"},
        {h:"자다", r:"jada", t:"Dormire", c:"Verbi"}, {h:"하다", r:"hada", t:"Fare", c:"Verbi"}, {h:"보다", r:"boda", t:"Vedere", c:"Verbi"},
        {h:"사랑", r:"sarang", t:"Amore", c:"Emozioni"}, {h:"행복", r:"haengbok", t:"Felicità", c:"Emozioni"}, {h:"슬픔", r:"seulpeum", t:"Tristezza", c:"Emozioni"},
        // TEMPO
        {h:"오늘", r:"oneul", t:"Oggi", c:"Tempo"}, {h:"내일", r:"naeil", t:"Domani", c:"Tempo"}, {h:"어제", r:"eoje", t:"Ieri", c:"Tempo"},
        {h:"지금", r:"jigeum", t:"Adesso", c:"Tempo"}, {h:"시간", r:"sigan", t:"Tempo/Ora", c:"Tempo"}
    ];

    const allCons = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    const allVows = ["ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ","ㅘ","ㅝ"];

    function genera() {
        isLock = false;
        transDiv.style.opacity = "0";
        const lv = document.getElementById('level').value;
        
        if (lv === "words") {
            let item = vocab[Math.floor(Math.random()*vocab.length)];
            targetH = item.h;
            currentTrans = item.t;
            catDisplay.innerText = item.c;
            display.innerText = item.r;
            hint.innerText = "Traduci in Hangul";
        } else {
            let c = allCons[Math.floor(Math.random()*allCons.length)];
            let v = allVows[Math.floor(Math.random()*allVows.length)];
            targetH = Hangul.assemble([c, v]);
            currentTrans = "";
            catDisplay.innerText = "Sillaba";
            display.innerText = targetH;
            hint.innerText = Hangul.disassemble(targetH).join("");
        }
        input.value = "";
        input.classList.remove('correct');
        setTimeout(() => input.focus(), 150);
    }

    const check = () => {
        if (isLock) return;
        let val = input.value.trim();
        if (val === targetH || Hangul.disassemble(val).join("") === Hangul.disassemble(targetH).join("")) {
            isLock = true;
            score += 10; streak++;
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
            if(currentTrans) { transDiv.innerText = "ITA: " + currentTrans; transDiv.style.opacity = "1"; }
            input.classList.add('correct');
            try {
                const m = new SpeechSynthesisUtterance(targetH);
                m.lang = 'ko-KR';
                window.speechSynthesis.speak(m);
            } catch(e) {}
            setTimeout(genera, 900);
        }
    };

    input.addEventListener('input', check);
    document.getElementById('level').onchange = genera;
    genera();
</script>
</body>
</html>
