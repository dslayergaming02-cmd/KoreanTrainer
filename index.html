<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Korean Trainer Ultra v5.2</title>
    <script src="https://unpkg.com/hangul-js@0.2.6/hangul.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        #display { font-size: 50px; font-weight: 800; color: var(--primary); margin: 15px 0; min-height: 80px; }
        #hint { font-size: 1.1rem; color: #b2bec3; margin-bottom: 15px; font-weight: 500; }
        select, input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 12px; border: 2px solid #eee; font-size: 1rem; box-sizing: border-box; }
        input { font-size: 24px; text-align: center; outline: none; background: #fafafa; border: 3px solid #eee; }
        input.correct { border-color: var(--success) !important; background: #e6fffb !important; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">🇰🇷 Trainer v5.2 (Mobile Fix)</div>
    <select id="mode"><option value="h2h">Hangul ➔ Hangul</option><option value="r2h">Latino ➔ Hangul</option></select>
    <select id="level">
        <option value="1">Sillabe Semplici</option>
        <option value="2">Batchim</option>
        <option value="3">Dittonghi</option>
        <option value="4">Parole</option>
    </select>
    <div id="display">--</div>
    <div id="hint">--</div>
    <input type="text" id="input" placeholder="Scrivi..." autocomplete="off">
    <div class="stats"><span>Punti: <span id="score">0</span></span><span>Streak: <span id="streak">0</span> 🔥</span></div>
</div>

<script>
    const input = document.getElementById('input');
    const display = document.getElementById('display');
    const hint = document.getElementById('hint');
    let targetH = "", targetR = "", score = 0, streak = 0;

    const romMap = {"ㄱ":"g","ㄴ":"n","ㄷ":"d","ㄹ":"r","ㅁ":"m","ㅂ":"b","ㅅ":"s","ㅇ":"","ㅈ":"j","ㅏ":"a","ㅓ":"eo","ㅗ":"o","ㅜ":"u","ㅡ":"eu","ㅣ":"i","ㄲ":"kk","ㅃ":"pp","ㅆ":"ss","ㅘ":"wa","ㅚ":"oe","ㅝ":"wo"};
    const vocab = [{h:"사과",r:"sagwa"},{h:"나무",r:"namu"},{h:"우유",r:"uyu"},{h:"사람",r:"saram"}];

    function getRoman(h) { return Hangul.disassemble(h).map(p => romMap[p] || p).join(""); }

    function genera() {
        let lv = document.getElementById('level').value;
        const mode = document.getElementById('mode').value;
        
        if (lv == "1") targetH = Hangul.assemble([["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ"][Math.floor(Math.random()*5)], ["ㅏ","ㅓ","ㅗ","ㅜ","ㅣ"][Math.floor(Math.random()*5)]]);
        else if (lv == "2") targetH = Hangul.assemble(["ㄱ", "ㅏ", ["ㄱ","ㄴ","ㄹ"][Math.floor(Math.random()*3)]]);
        else if (lv == "3") targetH = Hangul.assemble(["ㄲ", ["ㅘ","ㅚ","ㅝ"][Math.floor(Math.random()*3)]]);
        else { let item = vocab[Math.floor(Math.random()*vocab.length)]; targetH = item.h; }

        targetR = getRoman(targetH);
        display.innerText = (mode === "r2h") ? targetR : targetH;
        hint.innerText = (mode === "r2h") ? "Scrivi in Hangul" : targetR;
        input.value = "";
        input.classList.remove('correct');
        setTimeout(() => input.focus(), 10);
    }

    // IL FIX PER IL TELEFONO: Usiamo sia 'input' che 'keyup' per non perdere colpi
    const checkAnswer = () => {
        // Puliamo il testo da eventuali spazi o caratteri invisibili che il telefono aggiunge
        let val = input.value.trim();
        if (val === targetH && val !== "") {
            score += 10; streak++;
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
            input.classList.add('correct');
            
            // Audio
            const m = new SpeechSynthesisUtterance(targetH);
            m.lang = 'ko-KR';
            window.speechSynthesis.speak(m);

            // Reset forzato: svuotiamo subito e cambiamo
            setTimeout(genera, 200);
        }
    };

    input.addEventListener('input', checkAnswer);
    input.addEventListener('keyup', (e) => { if(e.key === 'Enter') checkAnswer(); });

    document.getElementById('level').onchange = genera;
    document.getElementById('mode').onchange = genera;
    genera();
</script>
</body>
</html>
